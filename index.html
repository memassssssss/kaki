<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApiarySMP — Панель управления</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #070a0f;
            --bg-surface: rgba(13, 19, 29, 0.88);
            --bg-card: rgba(8, 12, 18, 0.9);
            --border: rgba(94, 234, 212, 0.18);
            --border-focus: #5eead4;
            --frost-primary: #38efb0;
            --frost-bright: #5eead4;
            --frost-ice: #70e1ff;
            --frost-glow: rgba(56, 239, 176, 0.28);
            --txt-main: #f0f6fc;
            --txt-muted: #94a3b8;
            --txt-subtle: #5f7186;
            --green: #38efb0;
            --red: #f87171;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--txt-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* Фоновый снегопад */
        #snowCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }

        /* Неоновые градиенты северного сияния */
        .ambient-spot {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.25;
        }

        .ambient-spot-1 {
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, #10b981 0%, #06b6d4 40%, transparent 70%);
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
        }

        .ambient-spot-2 {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, #0284c7 0%, transparent 70%);
            bottom: -100px;
            right: -50px;
        }

        .admin-wrap {
            width: 100%;
            max-width: 640px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 30px rgba(56, 239, 176, 0.08);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            position: relative;
            z-index: 1;
        }

        /* Ледяная шапка сверху карточки */
        .admin-wrap::after {
            content: "";
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--frost-bright), var(--frost-ice), transparent);
        }

        .admin-header {
            text-align: center;
            margin-bottom: 26px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--frost-bright);
            background: rgba(94, 234, 212, 0.12);
            border: 1px solid rgba(94, 234, 212, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
            box-shadow: 0 0 10px rgba(56, 239, 176, 0.15);
        }

        .admin-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.7rem;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .admin-title span {
            color: var(--frost-bright);
            text-shadow: 0 0 16px var(--frost-glow);
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            color: var(--txt-subtle);
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-input, .admin-select {
            width: 100%;
            padding: 13px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--txt-main);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .admin-input:focus, .admin-select:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 14px var(--frost-glow);
        }

        .admin-select option {
            background: #0d131d;
            color: #ffffff;
            padding: 8px;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--frost-bright), var(--frost-primary));
            color: #071512;
            border: none;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 6px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 6px 18px rgba(56, 239, 176, 0.28);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(56, 239, 176, 0.42);
        }

        .btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: rgba(20, 28, 42, 0.85) !important;
            color: var(--txt-main) !important;
            border: 1px solid var(--border) !important;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3) !important;
        }

        .btn-secondary:hover {
            border-color: var(--frost-bright) !important;
            box-shadow: 0 6px 18px rgba(56, 239, 176, 0.2) !important;
        }

        .divider {
            margin: 24px 0;
            border-top: 1px dashed var(--border);
            text-align: center;
            position: relative;
        }

        .divider span {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: #0d131d;
            padding: 0 12px;
            font-size: 0.72rem;
            color: var(--txt-subtle);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 700;
        }

        .console-output {
            margin-top: 18px;
            background: #04070c;
            border: 1px solid rgba(94, 234, 212, 0.25);
            border-radius: 12px;
            padding: 14px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: var(--frost-bright);
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.6);
        }

        .console-output::-webkit-scrollbar {
            width: 6px;
        }

        .console-output::-webkit-scrollbar-thumb {
            background: rgba(94, 234, 212, 0.3);
            border-radius: 6px;
        }

        .status-msg {
            margin-top: 14px;
            font-size: 0.88rem;
            font-weight: 700;
            text-align: center;
            display: none;
        }

        .status-success { color: var(--green); }
        .status-error { color: var(--red); }
    </style>
</head>
<body>

    <canvas id="snowCanvas"></canvas>
    <div class="ambient-spot ambient-spot-1"></div>
    <div class="ambient-spot ambient-spot-2"></div>

    <div class="admin-wrap">
        <header class="admin-header">
            <span class="admin-badge">❄️ Зимний сезон 2026 • Управление</span>
            <h1 class="admin-title">Apiary<span>SMP</span> Admin</h1>
        </header>

        <!-- АВТОРИЗАЦИЯ ПО ПАРОЛЮ -->
        <div class="form-group">
            <label for="adminPass">Мастер-пароль администратора</label>
            <input type="password" id="adminPass" class="admin-input" placeholder="Введи секретный ключ...">
        </div>

        <!-- ВЫДАЧА ИЗ КАТАЛОГА БЕЗ ОПЛАТЫ -->
        <div class="form-group">
            <label for="playerNick">Игровой никнейм</label>
            <input type="text" id="playerNick" class="admin-input" placeholder="Например: Notch" autocomplete="off">
        </div>

        <div class="form-group">
            <label for="productSelect">Выбрать позицию для начисления</label>
            <select id="productSelect" class="admin-select">
                <option value="pass">⭐ Проходка на сервер (Вайтлист) — 135₽</option>
                <option value="paintings">🖼️ Кастомные картины (/pic) — 299₽</option>
                <option value="bee">🐝 Спутники: Базовый набор (Пчёлка, Эллей, Слайм, Гаст, Эндермен) — 349₽</option>
                <option value="pets_addon">🦇 Спутники: Тёмный пак (Векс, Мышь, Варден) — 159₽</option>
                <option value="scale">🍯 Рост в 1 блок — 349₽</option>
                <option value="spawn">✨ Эффект появления при входе — 199₽</option>
                <option value="elytra">🪽 Шлейф от элитр — 239₽</option>
                <option value="trails">🐾 Эффекты поступи (Трейлы) — 249₽</option>
                <option value="basesign">🪵 3D-вывеска для базы — 149₽</option>
                <option value="doorbell">🔔 Дверной звонок у дома — 129₽</option>
                <option value="lore">🏷️ Кастомизатор предметов (/lore, /rename) — 149₽</option>
                <option value="popper">🎉 Праздничная хлопушка — 99₽</option>
                <option value="sponsor">👑 Спонсор улья — 399₽</option>
                <option value="prefix">💬 Кастомный префикс — 249₽</option>
            </select>
        </div>

        <button type="button" id="grantBtn" class="btn-action" onclick="grantProduct()">
            Выдать товар игроку
        </button>

        <div class="divider"><span>ИЛИ RCON-КОМАНДА</span></div>

        <!-- ПРОИЗВОЛЬНАЯ КОМАНДА В СЕРВЕР -->
        <div class="form-group">
            <label for="rawCmd">Прямая команда в консоль сервера</label>
            <input type="text" id="rawCmd" class="admin-input" placeholder="Например: swl remove Notch или kick Player">
        </div>

        <button type="button" id="cmdBtn" class="btn-action btn-secondary" onclick="sendRawCommand()">
            Отправить команду
        </button>

        <div id="statusMsg" class="status-msg"></div>
        <div id="consoleLog" class="console-output"></div>
    </div>

    <script>
        const API_URL = "https://pay.apiarysmp.online/admin/grant";

        // Фоновый снегопад
        function initSnow() {
            const canvas = document.getElementById('snowCanvas');
            const ctx = canvas.getContext('2d');
            let width = (canvas.width = window.innerWidth);
            let height = (canvas.height = window.innerHeight);

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const count = Math.floor(Math.min(width, 1200) / 28);
            const flakes = [];

            for (let i = 0; i < count; i++) {
                flakes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2 + 0.8,
                    speedY: Math.random() * 0.8 + 0.4,
                    speedX: Math.random() * 0.4 - 0.2,
                    opacity: Math.random() * 0.5 + 0.2,
                    swing: Math.random() * Math.PI * 2,
                    swingSpeed: Math.random() * 0.02 + 0.01
                });
            }

            function render() {
                ctx.clearRect(0, 0, width, height);
                for (let i = 0; i < flakes.length; i++) {
                    const f = flakes[i];
                    f.swing += f.swingSpeed;
                    f.y += f.speedY;
                    f.x += f.speedX + Math.sin(f.swing) * 0.35;

                    if (f.y > height) {
                        f.y = -5;
                        f.x = Math.random() * width;
                    }
                    if (f.x > width) f.x = 0;
                    else if (f.x < 0) f.x = width;

                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(226, 241, 255, ${f.opacity})`;
                    ctx.fill();
                }
                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSnow();
            const saved = sessionStorage.getItem('apiary_adm_key');
            if (saved) {
                document.getElementById('adminPass').value = saved;
            }
        });

        function getPassword() {
            const pass = document.getElementById('adminPass').value.trim();
            if (pass) {
                sessionStorage.setItem('apiary_adm_key', pass);
            }
            return pass;
        }

        function showStatus(text, isError = false) {
            const el = document.getElementById('statusMsg');
            el.textContent = text;
            el.className = 'status-msg ' + (isError ? 'status-error' : 'status-success');
            el.style.display = 'block';
        }

        function showLog(lines) {
            const el = document.getElementById('consoleLog');
            if (!lines || lines.length === 0) return;
            el.textContent = lines.join('\n');
            el.style.display = 'block';
        }

        async function grantProduct() {
            const password = getPassword();
            const nickname = document.getElementById('playerNick').value.trim();
            const type = document.getElementById('productSelect').value;
            const btn = document.getElementById('grantBtn');

            if (!password) {
                showStatus("Введите мастер-пароль администратора!", true);
                return;
            }
            if (!nickname) {
                showStatus("Укажите никнейм игрока!", true);
                return;
            }

            btn.disabled = true;
            btn.textContent = "Начисление...";

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, nickname, type })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    showStatus(`Позиция «${type}» успешно выдана игроку ${nickname}!`);
                    showLog(data.log);
                } else {
                    showStatus(data.error || "Ошибка выдачи", true);
                    if (data.log) showLog(data.log);
                }
            } catch (err) {
                showStatus("Ошибка подключения к серверу бэкенда", true);
            } finally {
                btn.disabled = false;
                btn.textContent = "Выдать товар игроку";
            }
        }

        async function sendRawCommand() {
            const password = getPassword();
            const command = document.getElementById('rawCmd').value.trim();
            const btn = document.getElementById('cmdBtn');

            if (!password) {
                showStatus("Введите мастер-пароль администратора!", true);
                return;
            }
            if (!command) {
                showStatus("Введите команду для отправки!", true);
                return;
            }

            btn.disabled = true;
            btn.textContent = "Выполнение...";

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, command })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    showStatus("Команда выполнена консолью сервера!");
                    showLog(data.log);
                    document.getElementById('rawCmd').value = '';
                } else {
                    showStatus(data.error || "Ошибка выполнения команды", true);
                    if (data.log) showLog(data.log);
                }
            } catch (err) {
                showStatus("Ошибка подключения к серверу бэкенда", true);
            } finally {
                btn.disabled = false;
                btn.textContent = "Отправить команду";
            }
        }
    </script>
</body>
</html>
